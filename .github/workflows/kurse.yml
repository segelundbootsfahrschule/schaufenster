name: Kurstermine aktualisieren

on:
  schedule:
    - cron: "17 3 * * 1"   # wöchentlich, montags 04:17 Uhr (Winterzeit)
  workflow_dispatch:        # per Knopf in GitHub starten

permissions:
  contents: write

jobs:
  kurse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Termine aus dem Shop holen
        run: python scripts/kurse.py
      - name: Speichern, wenn sich Termine geändert haben
        run: |
          # Zeitstempel "stand" zählt nicht als Änderung.
          # Montags wird trotzdem gespeichert, damit GitHub den Zeitplan aktiv lässt.
          if git diff --quiet -I '"stand"' -- kurse.json && [ "$(date -u +%u)" != "1" ]; then
            echo "Keine neuen Termine."; git checkout -- kurse.json; exit 0
          fi
          git config user.name "schaufenster-bot"
          git config user.email "schaufenster-bot@users.noreply.github.com"
          git add kurse.json
          git commit -m "Kurstermine aktualisiert"
          git push
